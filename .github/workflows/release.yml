# Publishes the package with PyPI trusted publishing: no API tokens are stored.
#
# - Pushing a tag vX.Y.Z publishes to TestPyPI, then to PyPI.
# - Running the workflow by hand publishes to TestPyPI only.
#
# Each index needs a trusted publisher for this repo, this workflow file and the
# environment named below. The "pypi" environment should require a reviewer.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # never stop a release halfway

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tools (versions and hashes pinned)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Check that the tag matches the version in pyproject.toml
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi
      - name: Build the sdist and wheel
        run: python -m build --no-isolation  # hatchling comes from requirements-dev.txt
      - name: Install the wheel with its dependencies and load the plugin
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          /tmp/try/bin/python -c "from importlib.metadata import entry_points; assert 'percona-llmstxt' in {e.name for e in entry_points(group='mkdocs.plugins')}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mkdocs-percona-llmstxt/
    permissions:
      id-token: write  # trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # a version tried by hand before its tag is already there

  pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: testpypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mkdocs-percona-llmstxt/
    permissions:
      id-token: write  # trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
